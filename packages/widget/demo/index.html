<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapStudio V2 - Demo</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1D3557 0%, #E63946 100%);
      min-height: 100vh;
    }
    
    .demo-container {
      max-width: 950px;
      margin: 0 auto;
    }
    
    .demo-header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }
    
    .demo-header h1 {
      margin: 0 0 10px 0;
      font-size: 2.5rem;
    }
    
    .demo-header p {
      margin: 0;
      opacity: 0.9;
    }
    
    #widget-container {
      background: transparent;
    }
    
    .demo-footer {
      text-align: center;
      color: white;
      margin-top: 30px;
      padding: 20px;
      opacity: 0.8;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="demo-header">
      <h1>🔥 SnapStudio V2</h1>
      <p>Visualisez votre poêle dans votre intérieur avec l'IA</p>
    </div>
    
    <div id="widget-container"></div>
    
    <div class="demo-footer">
      <p>SnapStudio Widget V2 - Mayer Énergie</p>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
